<!--
  StikmNek — Business listing APPROVED (Resend template body)

  Variables (define in Resend with same keys):
    BUSINESS_NAME, ADMIN_NOTES

  Secret: RESEND_TEMPLATE_BUSINESS_APPROVED

  For the rejected variant, duplicate this template, change copy, use keys
  BUSINESS_NAME + ADMIN_NOTES and secret RESEND_TEMPLATE_BUSINESS_REJECTED.
-->
<!doctype html>
<html>
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>
  <body style="margin:0; padding:24px 12px; background:#f6f7f9; font-family:Arial, sans-serif; color:#0f172a;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px; margin:0 auto; background:#ffffff; border-radius:16px; overflow:hidden; box-shadow:0 8px 24px rgba(15,23,42,0.08);">
      <tr>
        <td style="padding:24px 22px;">
          <div style="font-weight:800; font-size:16px; color:#0d9488; margin-bottom:16px;">StikmNek</div>
          <p style="margin:0 0 12px; font-size:15px; line-height:1.5;">
            Congratulations! Your business listing <strong>{{{BUSINESS_NAME}}}</strong> has been approved and is now live on StikmNek.
          </p>
          <div style="margin-top:16px; font-size:14px; line-height:1.5; color:#334155; white-space:pre-wrap;">
            {{{ADMIN_NOTES}}}
          </div>
          <p style="margin:20px 0 0; font-size:13px; color:#64748b;">
            Thank you for listing with us.
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
