    <!--
      ═══════════════════════════════════════════════════════════════
      NUCLEAR FIX: This script runs BEFORE React loads.
      It kills any service worker and clears all caches.
      This is the FIRST thing that executes on page load.
      ═══════════════════════════════════════════════════════════════
    -->
    <script>
      (function() {
        // Flag to prevent infinite reload loops
        var NUKE_KEY = 'stikmnek-sw-nuked-v3';
        var alreadyNuked = false;
        
        try {
          alreadyNuked = sessionStorage.getItem(NUKE_KEY) === 'true';
        } catch(e) {}

        if ('serviceWorker' in navigator && !alreadyNuked) {
          // Check if there's an active service worker controlling this page
          if (navigator.serviceWorker.controller) {
            console.log('[NUKE-HTML] Active SW detected — killing it...');
            
            // Mark that we've started the nuke process (prevents reload loop)
            try { sessionStorage.setItem(NUKE_KEY, 'true'); } catch(e) {}
            
            // Show a visible updating message
            var overlay = document.createElement('div');
            overlay.id = 'sw-nuke-overlay';
            overlay.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:#fff;z-index:99999;display:flex;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,sans-serif;';
            overlay.innerHTML = '<div style="text-align:center;padding:2rem;"><div style="width:40px;height:40px;border:3px solid #e5e7eb;border-top-color:#0d9488;border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 1rem;"></div><p style="color:#0d9488;font-weight:600;font-size:1.1rem;">Updating StikmNek...</p><p style="color:#6b7280;font-size:0.875rem;margin-top:0.5rem;">Clearing old cache. This only happens once.</p></div><style>@keyframes spin{to{transform:rotate(360deg)}}</style>';
            document.body.appendChild(overlay);
            
            // Kill all service workers
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              var promises = regs.map(function(reg) {
                if (reg.waiting) reg.waiting.postMessage('SKIP_WAITING');
                return reg.unregister();
              });
              return Promise.all(promises);
            }).then(function() {
              console.log('[NUKE-HTML] All SWs unregistered');
              // Clear all caches
              if ('caches' in window) {
                return caches.keys().then(function(names) {
                  return Promise.all(names.map(function(n) { return caches.delete(n); }));
                });
              }
            }).then(function() {
              console.log('[NUKE-HTML] All caches cleared — reloading...');
              // Hard reload to get completely fresh content
              setTimeout(function() {
                window.location.reload();
              }, 500);
            }).catch(function(err) {
              console.error('[NUKE-HTML] Error during nuke:', err);
              // Reload anyway
              setTimeout(function() {
                window.location.reload();
              }, 1000);
            });
            
            // Safety: if the above takes too long, reload after 5 seconds anyway
            setTimeout(function() {
              window.location.reload();
            }, 5000);
            
            return; // Don't render React yet — we're about to reload
          }
        }
        
        // Also listen for any future SW changes
        if ('serviceWorker' in navigator) {
          var _refreshing = false;
          navigator.serviceWorker.addEventListener('controllerchange', function() {
            if (_refreshing) return;
            _refreshing = true;
            window.location.reload();
          });
          navigator.serviceWorker.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'FORCE_RELOAD' && !_refreshing) {
              _refreshing = true;
              window.location.reload();
            }
          });
        }
      })();
    </script>
